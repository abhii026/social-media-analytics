<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Social Media Analytics</title>
    <meta name="title" content="Social Media Analytics" />
    <meta name="description" content="Social Media Analysis platform for monitoring social media conversations, sentiment, trends, audience insights and network patterns." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Social Media Analytics" />
    <meta property="og:description" content="Social Media Analysis platform for monitoring social media conversations, sentiment, trends, audience insights and network patterns." />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Social Media Analytics" />
    <meta property="twitter:description" content="Social Media Analysis platform for monitoring social media conversations, sentiment, trends, audience insights and network patterns." />

    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236B705C'/><text y='.7em' x='18' font-size='60' fill='white'>A</text></svg>" />

    <!-- Synchronous theme setup to prevent flicker -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F5F5F3] dark:bg-[#181818] text-[#242424] dark:text-[#F2F2F2] min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
